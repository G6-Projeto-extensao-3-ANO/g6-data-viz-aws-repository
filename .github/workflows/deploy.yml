name: Deploy Application

on:
  workflow_run:
    workflows:
      - Infrastructure
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Obter Instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name projeto-ec2 \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2: $INSTANCE_ID"

      - name: Enviar install.sh
        run: |
          SCRIPT=$(base64 -w 0 scripts/install.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"mkdir -p /opt/scripts\",
              \"echo $SCRIPT | base64 -d > /opt/scripts/install.sh\",
              \"chmod +x /opt/scripts/install.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)
          echo "Install command: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar envio do install.sh
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Executar install.sh
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/scripts/install.sh"]' \
            --query "Command.CommandId" \
            --output text)
          echo "Install execution: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar instalação
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Mostrar resultado da instalação
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Enviar deploy.sh
        run: |
          SCRIPT=$(base64 -w 0 scripts/deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"mkdir -p /opt/scripts\",
              \"echo $SCRIPT | base64 -d > /opt/scripts/deploy.sh\",
              \"chmod +x /opt/scripts/deploy.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Deploy script command: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar envio do deploy.sh
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Executar deploy.sh
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/scripts/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deploy execution: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar deploy
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

          echo "Aguardando deploy..."
          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            STATUS_DETAILS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StatusDetails" \
              --output text)

            echo "[$i/180] Status: $STATUS | Details: $STATUS_DETAILS"

            case "$STATUS" in

              Success)
                echo "========================================="
                echo " DEPLOY CONCLUÍDO"
                echo "========================================="
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "========================================="
                echo " DEPLOY FALHOU"
                echo "========================================="

                echo
                echo "STDOUT:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                echo
                echo "STDERR:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              Pending|InProgress)
                sleep 10
                ;;

              *)
                echo "Status desconhecido: $STATUS"
                sleep 10
                ;;

            esac

          done

          echo "========================================="
          echo " TIMEOUT DO DEPLOY"
          echo "========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          exit 1

      - name: Mostrar resultado do deploy
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Compactar Docker
        run: |
          tar -czf docker.tar.gz infrastructure/docker

          echo "Pacote Docker:"
          ls -lh docker.tar.gz

      - name: Enviar Docker para EC2
        run: |
          DOCKER_BASE64=$(base64 -w 0 docker.tar.gz)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"mkdir -p /home/ubuntu\",
              \"echo $DOCKER_BASE64 | base64 -d > /home/ubuntu/docker.tar.gz\",
              \"rm -rf /home/ubuntu/docker\",
              \"tar -xzf /home/ubuntu/docker.tar.gz -C /home/ubuntu\",
              \"chown -R ubuntu:ubuntu /home/ubuntu/docker\",
              \"rm -f /home/ubuntu/docker.tar.gz\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Envio Docker: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar envio do Docker
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Verificar arquivos Docker
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo === Docker ===",
              "find /home/ubuntu/docker -maxdepth 3 -type f | sort",
              "echo",
              "echo === Docker Compose ===",
              "docker compose version"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Verificação: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar verificação Docker
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Mostrar arquivos Docker
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Validar Docker Compose
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/docker",
              "docker compose config"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Validação Compose: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar validação do Compose
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Mostrar validação do Compose
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Executar Docker Compose
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/docker",
              "docker compose down || true",
              "docker compose up -d --pull always"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Docker Compose: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar Docker Compose
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Verificar containers
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Status dos containers
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/docker",
              "docker compose ps",
              "echo",
              "docker ps --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Status command: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Aguardar status
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Mostrar status final
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text